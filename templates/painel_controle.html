<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Controle - {{ sala | capitalize }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
    <style>
        body {
            background-image: url("{{ url_for('static', filename='tela_principal.png') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(5px);
            border-radius: 15px;
            transition: transform 0.2s;
        }
        .lista-espera {
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark" style="background-color: rgba(27, 54, 93, 0.9);">
        <div class="container-fluid py-2 position-relative">
            <a href="/painel" class="btn btn-outline-light position-absolute start-0 ms-3">⬅️ Voltar</a>
            <span class="navbar-brand mb-0 h4 fw-bold text-uppercase mx-auto">
                {% if sala == 'triagem' %} 🩺 Controle de Fila - Triagem
                {% elif sala == 'A' %} 👩‍⚕️ Controle de Fila - A
                {% elif sala == 'B' %} 👨‍⚕️ Controle de Fila - B
                {% endif %}
            </span>
        </div>
    </nav>

    <div class="container mt-4 text-center">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow p-4 mx-auto glass-card" style="border-top: 5px solid #2C3E50;">
                    
                    <h1 class="display-1 fw-bold text-dark mb-1" id="senhaAtual">--</h1>
                    <p class="text-muted mb-4">Última Senha Chamada</p>
                    
                    <!-- BOTÕES PRINCIPAIS -->
                    {% if sala == 'triagem' %}
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <button onclick="chamarNovaTriagem('A')" class="btn btn-danger w-100 py-3 fw-bold fs-6 shadow">🔔 Nova Senha A </button>
                            </div>
                            <div class="col-6">
                                <button onclick="chamarNovaTriagem('B')" class="btn btn-primary w-100 py-3 fw-bold fs-6 shadow">🔔 Nova Senha B</button>
                            </div>
                        </div>
                    {% endif %}
                    
                    <!-- HISTÓRICO PARA TODOS (TRIAGEM E MÉDICOS) -->
                    <h5 class="text-start mt-3 mb-2 border-bottom pb-2 text-secondary fw-bold">📋 Pacientes no Histórico</h5>
                    <div class="lista-espera text-start">
                        <ul class="list-group" id="listaPacientes">
                            <li class="list-group-item text-center text-muted py-3">Carregando lista...</li>
                        </ul>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        const socket = io();
        const salaAtual = "{{ sala }}"; 
        
        socket.on('connect', () => { socket.emit('pedir_listas'); });

        function chamarNovaTriagem(fila) { socket.emit('chamar_nova_triagem', { fila: fila }); }
        function chamarMedico(senha) { socket.emit('chamar_medico', { senha: senha, sala: salaAtual }); }
        function rechamarSenha(senha) { socket.emit('rechamar_senha', { senha: senha, sala: salaAtual }); }

        socket.on('nova_chamada', function(dados) {
            if (dados.sala_origem === salaAtual) {
                document.getElementById('senhaAtual').innerText = dados.senha;
            }
        });

        // Atualiza as tabelas para Triagem e Médicos
        socket.on('atualizar_listas', function(filas_medicos) {
            const listaUl = document.getElementById('listaPacientes');
            listaUl.innerHTML = ''; 
            
            let pacientes = [];
            
            // A Triagem vê os dois fluxos misturados no histórico
            if (salaAtual === 'triagem') {
                pacientes = [...filas_medicos['A'], ...filas_medicos['B']];
            } else {
                const fila = (salaAtual === 'A') ? 'A' : 'B';
                pacientes = filas_medicos[fila];
            }
            
            if (pacientes.length === 0) {
                listaUl.innerHTML = '<li class="list-group-item text-center text-muted py-3">Nenhum paciente no histórico.</li>';
            } else {
                pacientes.forEach(senha => {
                    const li = document.createElement('li');
                    li.className = "list-group-item d-flex justify-content-between align-items-center mb-1 shadow-sm rounded border";
                    
                    let botoesHTML = '';
                    
                    if (salaAtual === 'triagem') {
                        // Triagem só rechama
                        botoesHTML = `<button onclick="rechamarSenha('${senha}')" class="btn btn-warning fw-bold text-dark btn-sm px-3">🔁 Rechamar Triagem</button>`;
                    } else {
                        // Médicos chamam e rechamam
                        const corBotao = (salaAtual === 'A') ? 'btn-danger' : 'btn-primary';
                        botoesHTML = `
                            <button onclick="chamarMedico('${senha}')" class="btn ${corBotao} fw-bold btn-sm me-2 px-3">▶️ Chamar</button>
                            <button onclick="rechamarSenha('${senha}')" class="btn btn-warning fw-bold text-dark btn-sm px-2">🔁 Rechamar</button>
                        `;
                    }
                    
                    li.innerHTML = `
                        <span class="fs-5 fw-bold text-dark ms-2">${senha}</span>
                        <div>${botoesHTML}</div>
                    `;
                    listaUl.appendChild(li);
                });
            }
        });
    </script>
</body>
</html>
