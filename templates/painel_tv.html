<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Visor da Recepção (Modo Transparente OBS)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Fundo transparente para não tampar o e-saúde no OBS */
        body {
            background-color: transparent;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        
        .alerta-chamada {
            background: rgba(231, 76, 60, 0.95);
            color: white;
            padding: 60px 120px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border: 5px solid white;
            display: none; 
            position: absolute;
            z-index: 999;
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>
<body>

    <div class="alerta-chamada" id="alertaCaixa">
        <h2 class="fw-bold mb-4 text-uppercase text-light" id="salaDisplay">Aguardando...</h2>
        <h1 class="fw-bold" style="font-size: 12rem; margin: 0; text-shadow: 4px 4px 10px rgba(0,0,0,0.5);" id="senhaDisplay">--</h1>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    
    <script>
        const socket = io();
        const alertaCaixa = document.getElementById('alertaCaixa');
        const senhaDisplay = document.getElementById('senhaDisplay');
        const salaDisplay = document.getElementById('salaDisplay');
        let timerOcultar;

        socket.on('nova_chamada', function(dados) {
            senhaDisplay.innerText = dados.senha;
            
            let nomeSala = "";
            let nomeFalar = "";
            
            if (dados.sala_origem === 'triagem') {
                nomeSala = "Comparecer à Triagem";
                nomeFalar = "Triagem";
            } else if (dados.sala_origem === 'A') {
                nomeSala = "Consultório 01";
                nomeFalar = "Consultório um"; 
            } else if (dados.sala_origem === 'B') {
                nomeSala = "Consultório 02";
                nomeFalar = "Consultório Dois";
            }
            
            salaDisplay.innerText = nomeSala;
            alertaCaixa.style.display = 'block';

            window.speechSynthesis.cancel();
            
            let textoChamada = "Senha " + dados.senha + ". Comparecer à " + nomeFalar;

            for (let i = 0; i < 2; i++) {
                let locucao = new SpeechSynthesisUtterance(textoChamada);
                locucao.lang = 'pt-BR';
                locucao.rate = 0.9; 
                window.speechSynthesis.speak(locucao);
            }

            clearTimeout(timerOcultar);
            timerOcultar = setTimeout(() => {
                alertaCaixa.style.display = 'none';
            }, 12000);
        });
    </script>
</body>
</html>
