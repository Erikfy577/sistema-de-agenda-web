<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='icone.ico') }}" type="image/x-icon">
    <style>
        body {
            background-image: url("{{ url_for('static', filename='tela_cadastro.png') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <a class="btn btn-outline-light btn-sm fw-bold" href="/">← Voltar ao Início</a>
            <span class="navbar-text text-white fw-bold">NOVO CADASTRO</span>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <div class="card shadow mx-auto glass-card" style="max-width: 600px;">
            <div class="card-body p-5">
                {% if mensagem %}
                <div class="alert alert-success fw-bold text-center">{{ mensagem }}</div>
                {% endif %}
                
                <form id="cadastroForm" method="POST" action="/cadastro">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nome Completo:</label>
                        <input type="text" name="nome" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Telefone / WhatsApp:</label>
                        <input type="text" name="telefone" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Profissional:</label>
                        <select name="profissional" class="form-select">
                            <option>Dra. Jamile</option>
                            <option>Dra. Laurice</option>
                            <option>Dr. Gerlando</option>
                            <option>Jadson</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold">Tipo de Atendimento:</label>
                            <select name="atendimento_tipo" class="form-select">
                                <option value="Primeira Vez">Nova Consulta</option>
                                <option value="Retorno">Retorno</option>
                            </select>
                        </div>
                        
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold">Prioridade:</label>
                            <select name="prioridade" class="form-select">
                                <option value="Eletivo">Eletivo</option>
                                <option value="Prioritário">Prioritário</option>
                                <option value="Urgente">Urgente</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" id="btnSubmit" class="btn btn-success w-100 py-2 fw-bold mb-4">Salvar na Fila</button>
                </form>

            </div>
        </div>
    </div>

   <!-- Script de Integração e Segurança Make (Envia todos para o Router) -->
    <script>
        document.getElementById('cadastroForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 

            const form = e.target;
            const btn = document.getElementById('btnSubmit');
            const originalText = btn.innerHTML;
            
            // Trava o botão para evitar duplicidade
            btn.innerHTML = 'Enviando p/ Planilha... <span class="spinner-border spinner-border-sm"></span>';
            btn.disabled = true;

            // Coleta os dados do formulário
            const payload = {
                nome: form.nome.value,
                telefone: form.telefone.value,
                profissional: form.profissional.value,
                prioridade: form.prioridade.value,
                atendimento_tipo: form.atendimento_tipo.value,
                status: "Aguardando"
            };

            try {
                // Envia TUDO para o Make fazer a triagem
                const response = await fetch('https://hook.us2.make.com/v90f1fet2o1i2hwsk2arkvxssl8zucy8', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Se o Make confirmar o recebimento, salva no sistema local
                if (response.ok) {
                    form.submit(); 
                } else {
                    alert('Erro de Segurança: O Make não confirmou o registro. A inserção foi cancelada.');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Falha de Comunicação Webhook:', error);
                alert('Erro na conexão com a automação. Verifique a internet e tente novamente.');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
