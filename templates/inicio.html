<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Menu Principal - Telessaúde</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
    <style>
        /* Configuração da Imagem de Fundo */
        body {
            background-image: url("{{ url_for('static', filename='tela_principal.png') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
        
        /* Efeito de transparência nos cartões (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(5px);
            border-radius: 15px;
            transition: transform 0.2s; /* Animação suave */
        }
        
        /* Efeito de flutuar ao passar o mouse */
        .glass-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2) !important;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark" style="background-color: rgba(27, 54, 93, 0.9);">
        <div class="container-fluid justify-content-center py-2">
            <span class="navbar-brand mb-0 h4 fw-bold text-uppercase">Sistema de Agendamento e Telessaúde</span>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center text-center">
            
            <div class="col-md-4 mb-4">
                <div class="card shadow h-100 glass-card" style="border-top: 5px solid #18BC9C;">
                    <div class="card-body py-5">
                        <h4 class="card-title fw-bold text-secondary mb-3">📝 Novo Cadastro</h4>
                        <p class="text-muted mb-4">Adicionar um novo paciente à fila de espera.</p>
                        <a href="/cadastro" class="btn btn-success w-100 py-2 fw-bold">Acessar</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-4">
                <div class="card shadow h-100 glass-card" style="border-top: 5px solid #F39C12;">
                    <div class="card-body py-5">
                        <h4 class="card-title fw-bold text-secondary mb-3">⏳ Fila de Espera</h4>
                        <p class="text-muted mb-4">Gerenciar pacientes que aguardam uma data.</p>
                        <a href="/espera" class="btn btn-warning text-dark w-100 py-2 fw-bold">Acessar</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-4">
                <div class="card shadow h-100 glass-card" style="border-top: 5px solid #3498DB;">
                    <div class="card-body py-5">
                        <h4 class="card-title fw-bold text-secondary mb-3">🗓️ Agenda do Dia</h4>
                        <p class="text-muted mb-4">Visualizar consultas e enviar avisos automáticos.</p>
                        <a href="/agenda" class="btn btn-primary w-100 py-2 fw-bold">Acessar</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
